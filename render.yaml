services:
  - type: web
    name: go-pharmacy
    runtime: docker
    plan: free

    healthCheckPath: /up

    envVars:
      - key: APP_NAME
        value: "Go Pharmacy"

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: false

      - key: APP_KEY
        sync: false

      - key: APP_URL
        sync: false

      - key: DB_CONNECTION
        value: pgsql

      - key: DB_HOST
        fromDatabase:
          name: go-pharmacy-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: go-pharmacy-db
          property: port

      - key: DB_DATABASE
        fromDatabase:
          name: go-pharmacy-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: go-pharmacy-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: go-pharmacy-db
          property: password

      - key: SESSION_DRIVER
        value: database

      - key: CACHE_STORE
        value: database

      - key: QUEUE_CONNECTION
        value: database

      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: go-pharmacy-db
    plan: free
